[project]
name = "dfa-embeddings"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Marcell Vazquez-Chanlatte", email = "mvc@linux.com" }
]
dependencies = [
    "gatv2-eqx @ file:///home/mvc/work/dfa-embeddings/../gatv2",
    "jaxtyping>=0.2.36",
    "beartype>=0.19.0",
    "equinox>=0.11.11",
    "jax>=0.4.38",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "jax[cuda12]>=0.4.38",
    "bpython>=0.24",
    "dfa-sampler>=0.1.1",
    "networkx>=3.4.2",
    "funcy>=2.0",
    "optax>=0.2.4",
    "pygraphviz>=1.14",
    "mlflow>=2.19.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dfa_embeddings"]
